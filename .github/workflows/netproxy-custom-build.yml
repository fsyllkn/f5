name: NetProxy Custom Full Build

on:
  push:
    branches:
      - netproxy-build-ef6db52-20260925
    paths:
      - '.github/workflows/netproxy-custom-build.yml'
      - 'netproxy-build/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Checkout latest NetProxy source
        uses: actions/checkout@v4
        with:
          repository: Fanju6/NetProxy-Magisk
          ref: ef6db52dc1476140a73aceca4d0b17b8bdc644f1
          path: netproxy-src
          fetch-depth: 0

      - name: Apply custom four-group config
        shell: bash
        run: |
          set -euo pipefail
          cp netproxy-build/config.json netproxy-src/src/module/config/singbox/config.json
          mkdir -p netproxy-src/src/module/config/singbox/rules/remote/geosite
          curl -fL --retry 3             https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/telegram.srs             -o netproxy-src/src/module/config/singbox/rules/remote/geosite/telegram.srs
          python3 -m json.tool netproxy-src/src/module/config/singbox/config.json >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ] ||
             [ ! -x "$ANDROID_HOME/build-tools/37.0.0/aapt2" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"               'platforms;android-37.0' 'build-tools;37.0.0' --channel=1
          fi

      - name: Build Manager APK
        shell: bash
        working-directory: netproxy-src/src/android
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --build-cache --parallel --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../module/NetProxy.apk

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: netproxy-src/src/native/netproxy/go.mod
          cache: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: netproxy-src/src/webui/package-lock.json

      - name: Build native component
        shell: bash
        working-directory: netproxy-src
        env:
          NETPROXY_CI_BUILD_DIR: ${{ runner.temp }}/netproxy-build
        run: |
          set -euo pipefail
          sh tests/ci_verify.sh
          install -m 0755 "$NETPROXY_CI_BUILD_DIR/netproxyctl-android" src/module/bin/netproxyctl

      - name: Build WebUI
        shell: bash
        working-directory: netproxy-src/src/webui
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare version metadata
        id: meta
        shell: bash
        working-directory: netproxy-src
        run: |
          set -euo pipefail
          COMMIT_COUNT=$(git rev-list --count HEAD)
          sed -i "s/^versionCode=.*/versionCode=$COMMIT_COUNT/" src/module/module.prop
          VERSION=$(grep '^version=' src/module/module.prop | cut -d= -f2)
          NAME="NetProxy_${VERSION}_${COMMIT_COUNT}_custom-four-groups_with-manager.zip"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk=NetProxy_Manager_${VERSION}_${COMMIT_COUNT}_custom.apk" >> "$GITHUB_OUTPUT"

      - name: Package full flashable ZIP
        shell: bash
        working-directory: netproxy-src
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          NAME="${{ steps.meta.outputs.name }}"
          APK="${{ steps.meta.outputs.apk }}"
          test -s src/module/NetProxy.apk
          (
            cd src/module
            7z a -tzip -mx=5 "../../$NAME" .
          )
          7z t "$NAME"
          cp src/module/NetProxy.apk "$APK"
          sha256sum "$NAME" "$APK" > SHA256SUMS.txt
          unzip -l "$NAME" | grep -q 'NetProxy.apk'
          unzip -p "$NAME" config/singbox/config.json | grep -q '🤖 AI 平台'

      - name: Upload complete build
        uses: actions/upload-artifact@v4
        with:
          name: netproxy-custom-full-build
          path: |
            netproxy-src/NetProxy_*_custom-four-groups_with-manager.zip
            netproxy-src/NetProxy_Manager_*_custom.apk
            netproxy-src/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
